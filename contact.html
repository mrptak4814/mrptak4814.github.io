<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caleb | Contact</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="immersive-header">
        <nav>
            <ul>
                <li><a href="index.html">About Caleb</a></li>
                <li><a href="resume.html">Resume & Headshots</a></li>
                <li><a href="media.html">Media</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="sub-hero">
        <div class="sub-hero-content">
            <h1>Get in Touch</h1>
            <p class="tagline-hero">Bookings & Inquiries</p>
        </div>
    </section>

    <main class="page-content-wrapper">
        <section class="content-section">
            
            <div class="contact-buttons">
                <a href="mailto:exampleemail@gmail.com" class="btn-social email">
                    <i class="fas fa-envelope"></i> Email
                </a>
                
                <a href="https://www.youtube.com/@YourChannelHandle" target="_blank" class="btn-social youtube">
                    <i class="fab fa-youtube"></i> YouTube
                </a>

                <a href="https://www.linkedin.com/in/yourprofile" target="_blank" class="btn-social linkedin">
                    <i class="fab fa-linkedin"></i> LinkedIn
                </a>
            </div>

            <hr class="divider">

            <div class="form-container">
                <h2>For Inquiries</h2>
                <p>Please fill out the form below to get in touch.</p>

                <form action="https://formspree.io/f/mnneegnl" method="POST">
                    
                    <div class="form-group">
                        <label for="email">Email Address <span class="required">*</span></label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject <span class="required">*</span></label>
                        <input type="text" id="subject" name="subject" placeholder="Reason for inquiry" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone <span class="required">*</span></label>
                        <input type="tel" id="phone" name="phone" placeholder="(555) 555-5555" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message <span class="required">*</span></label>
                        <textarea id="message" name="message" rows="5" placeholder="How can we work together?" required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">SUBMIT</button>

                </form>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2025 Caleb [Last Name].</p>
    </footer>

</body>
</html>
