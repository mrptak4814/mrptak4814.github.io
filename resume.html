<!DOCTYPE html>
<html lang="en">
<head>

    <title>Caleb | Resume & Headshots</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <header class="immersive-header">
        <nav>
            <ul>
                <li><a href="index.html">About Caleb</a></li>
                <li><a href="resume.html" class="active">Resume & Headshots</a></li>
                <li><a href="media.html">Media</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

    <section class="sub-hero">
        <div class="sub-hero-content">
            <h1>Resume & Headshots</h1>
            <p class="tagline-hero">Experience & Credits</p>
        </div>
    </section>

    <main class="page-content-wrapper">
        
        <section class="content-section">
            <div class="download-bar">
                <p><a href="resume.pdf" target="_blank" download>Download PDF</a></p>
            </div>

            <div class="pdf-viewer-container">
                <object data="resume.pdf#toolbar=0&navpanes=0&scrollbar=0&view=FitH" type="application/pdf" width="100%" height="100%">
                    <p>Unable to display PDF file. <a href="resume.pdf">Download</a> instead.</p>

            </div>
        </section>

        <hr class="divider">

        <section class="content-section" id="headshots">
            <h2 class="section-title">Headshots</h2>
            
            <div class="headshot-grid">
                <div class="headshot-item">
                    <img src="headshot1.jpg" alt="Commercial Headshot">
                    <p class="caption">Commercial Look</p>
                </div>

                <div class="headshot-item">
                    <img src="headshot2.jpg" alt="Theatrical Headshot">
                    <p class="caption">Theatrical Look</p>
                </div>
                
                <div class="headshot-item">
                    <img src="headshot3.jpg" alt="Comedic Headshot">
                    <p class="caption">Comedic Look</p>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2025 Caleb [Last Name].</p>
    </footer>
